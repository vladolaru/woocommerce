<div class="woocommerce_order_items_wrapper wc-order-items-editable">
	<table cellpadding="0" cellspacing="0" class="woocommerce_order_items">
		<thead>
			<tr>
				<th class="item sortable" colspan="2" data-sort="string-ins">Item</th>
												<th class="item_cost sortable" data-sort="float">Price</th>
				<th class="quantity sortable" data-sort="int">Qty</th>
				<th class="line_cost sortable" data-sort="float">Total</th>
								<th class="wc-order-edit-line-item" width="1%">&nbsp;</th>
			</tr>
		</thead>
		<tbody id="order_line_items">
					</tbody>
		<tbody id="order_fee_line_items">
					</tbody>
		<tbody id="order_shipping_line_items">
					</tbody>
		<tbody id="order_refunds">
					</tbody>
	</table>
</div>
<div class="wc-order-data-row wc-order-totals-items wc-order-items-editable">
		<table class="wc-order-totals">
			<tr>
				<td class="label">Items Subtotal:</td>
				<td width="1%"></td>
				<td class="total">
					<span class="woocommerce-Price-amount amount"><bdi><span class="woocommerce-Price-currencySymbol" translate="no" dir="auto">&#36;</span>0.00</bdi></span>				</td>
			</tr>
				
		
		
		
		
		
		<tr>
			<td class="label">Order Total:</td>
			<td width="1%"></td>
			<td class="total">
				<span class="woocommerce-Price-amount amount"><bdi><span class="woocommerce-Price-currencySymbol" translate="no" dir="auto">&#36;</span>25.00</bdi></span>			</td>
		</tr>

	</table>

	<div class="clear"></div>

	
	
	
	<div class="clear"></div>

	<table class="wc-order-totals">
			</table>

	<div class="clear"></div>
</div>
<div class="wc-order-data-row wc-order-bulk-actions wc-order-data-row-toggle">
	<p class="add-items">
					<span class="description"><span class="woocommerce-help-tip" tabindex="0" aria-label="To edit this order change the status back to &quot;Pending payment&quot;" data-tip="To edit this order change the status back to &quot;Pending payment&quot;"></span> This order is no longer editable.</span>
							<button type="button" class="button refund-items">Refund</button>
							</p>
</div>
<div class="wc-order-data-row wc-order-add-item wc-order-data-row-toggle" style="display:none;">
	<button type="button" class="button add-order-item">Add product(s)</button>
	<button type="button" class="button add-order-fee">Add fee</button>
	<button type="button" class="button add-order-shipping">Add shipping</button>
			<button type="button" class="button cancel-action">Cancel</button>
	<button type="button" class="button button-primary save-action">Save</button>
</div>
<div class="wc-order-data-row wc-order-refund-items wc-order-data-row-toggle" style="display: none;">
	<table class="wc-order-totals">
					<tr>
				<td class="label"><label for="restock_refunded_items">Restock refunded items:</label></td>
				<td class="total"><input type="checkbox" id="restock_refunded_items" name="restock_refunded_items"  checked='checked' /></td>
			</tr>
				<tr>
			<td class="label">Amount already refunded:</td>
			<td class="total">-<span class="woocommerce-Price-amount amount"><bdi><span class="woocommerce-Price-currencySymbol" translate="no" dir="auto">&#36;</span>0.00</bdi></span></td>
		</tr>
		<tr>
			<td class="label">Total available to refund:</td>
			<td class="total"><span class="woocommerce-Price-amount amount"><bdi><span class="woocommerce-Price-currencySymbol" translate="no" dir="auto">&#36;</span>25.00</bdi></span></td>
		</tr>
		<tr>
			<td class="label">
				<label for="refund_amount">
					<span class="woocommerce-help-tip" tabindex="0" aria-label="Refund the line items above. This will show the total amount to be refunded" data-tip="Refund the line items above. This will show the total amount to be refunded"></span>					Refund amount:
				</label>
			</td>
			<td class="total">
				<input type="text" id="refund_amount" name="refund_amount" class="wc_input_price"
								/>
				<div class="clear"></div>
			</td>
		</tr>
		<tr>
			<td class="label">
				<label for="refund_reason">
					<span class="woocommerce-help-tip" tabindex="0" aria-label="Note: the refund reason will be visible by the customer." data-tip="Note: the refund reason will be visible by the customer."></span>					Reason for refund (optional):				</label>
			</td>
			<td class="total">
				<input type="text" id="refund_reason" name="refund_reason" />
				<div class="clear"></div>
			</td>
		</tr>
	</table>
	<div class="clear"></div>
	<div class="refund-actions">
						<button type="button" class="button button-primary do-manual-refund tips" data-tip="You will need to manually issue a refund through your payment gateway after using this.">Refund <span class="wc-order-refund-amount"><span class="woocommerce-Price-amount amount"><span class="woocommerce-Price-currencySymbol" dir="auto">&#036;</span>0.00</span></span> manually</button>
		<button type="button" class="button cancel-action">Cancel</button>
		<input type="hidden" id="refunded_amount" name="refunded_amount" value="0" />
		<div class="clear"></div>
	</div>
</div>

<script type="text/template" id="tmpl-wc-modal-add-products">
	<div class="wc-backbone-modal wc-backbone-modal-add-products">
		<div class="wc-backbone-modal-content">
			<section class="wc-backbone-modal-main" role="main">
				<header class="wc-backbone-modal-header">
					<h1>Add products</h1>
					<button class="modal-close modal-close-link dashicons dashicons-no-alt">
						<span class="screen-reader-text">Close modal panel</span>
					</button>
				</header>
				<article>
					<form action="" method="post">
						<table class="widefat">
							<thead>
								<tr>
									<th>Product</th>
									<th>Quantity</th>
								</tr>
							</thead>
														<tbody data-row="
									&lt;td&gt;&lt;select class=&quot;wc-product-search&quot; name=&quot;item_id&quot; data-allow_clear=&quot;true&quot; data-display_stock=&quot;true&quot; data-exclude_type=&quot;variable&quot; data-placeholder=&quot;Search for a product&hellip;&quot;&gt;&lt;/select&gt;&lt;/td&gt;
									&lt;td&gt;&lt;input type=&quot;number&quot; step=&quot;1&quot; min=&quot;0&quot; max=&quot;9999&quot; autocomplete=&quot;off&quot; name=&quot;item_qty&quot; placeholder=&quot;1&quot; size=&quot;4&quot; class=&quot;quantity&quot; /&gt;&lt;/td&gt;">
								<tr>
									
									<td><select class="wc-product-search" name="item_id" data-allow_clear="true" data-display_stock="true" data-exclude_type="variable" data-placeholder="Search for a product&hellip;"></select></td>
									<td><input type="number" step="1" min="0" max="9999" autocomplete="off" name="item_qty" placeholder="1" size="4" class="quantity" /></td>								</tr>
							</tbody>
						</table>
					</form>
				</article>
				<footer>
					<div class="wc-backbone-modal-buttons">
						<button id="btn-ok" class="button button-primary button-large">Add</button>
					</div>
				</footer>
			</section>
		</div>
	</div>
	<div class="wc-backbone-modal-backdrop modal-close"></div>
</script>

<script type="text/template" id="tmpl-wc-modal-add-tax">
	<div class="wc-backbone-modal wc-modal-add-tax">
		<div class="wc-backbone-modal-content">
			<section class="wc-backbone-modal-main" role="main">
				<header class="wc-backbone-modal-header">
					<h1>Add tax</h1>
					<button class="modal-close modal-close-link dashicons dashicons-no-alt">
						<span class="screen-reader-text">Close modal panel</span>
					</button>
				</header>
				<article>
					<form action="" method="post">
						<p class="search-box" data-wc-tax-rate-search-box>
							<label class="screen-reader-text" for="add_order_tax_search">Search tax rates:</label>
							<span class="screen-reader-text" id="add_order_tax_search_description">
								Search by name, code, class, rate, or ID.							</span>
							<input
								type="search"
								id="add_order_tax_search"
								name="s"
								data-wc-tax-rate-search
								aria-describedby="add_order_tax_search_description"
								placeholder="Search"
							/>
							<button type="submit" class="button">Search tax rates</button>
							<span class="description wc-tax-rate-search-summary" data-wc-tax-rate-search-summary hidden></span>
						</p>
						<br class="clear" />
						<table class="widefat striped wc-tax-rate-results" data-wc-tax-rate-results data-per_page="10">
							<thead>
								<tr>
									<th scope="col">
										<span class="screen-reader-text">Select tax rate</span>
										<span aria-hidden="true">&nbsp;</span>
									</th>
									<th scope="col">Rate name</th>
									<th scope="col">Tax class</th>
									<th scope="col">Rate code</th>
									<th scope="col">Rate %</th>
								</tr>
							</thead>
							<tbody>
								<tr class="no-items">
									<td class="colspanchange wc-tax-rate-status" colspan="5">Loading tax rates…</td>
								</tr>
							</tbody>
						</table>
						<div class="tablenav bottom" data-wc-tax-rate-pagination-container>
							<div class="tablenav-pages" data-wc-tax-rate-pagination data-page="1" data-total-pages="1">
								<span class="displaying-num"></span>
								<span class="pagination-links">
									<button type="button" class="first-page button" disabled>
										<span class="screen-reader-text">First page</span>
										<span aria-hidden="true">&laquo;</span>
									</button>
									<button type="button" class="prev-page button" disabled>
										<span class="screen-reader-text">Previous page</span>
										<span aria-hidden="true">&lsaquo;</span>
									</button>
									<span class="paging-input">
										<label for="add_order_tax_current_page" class="screen-reader-text">Current page</label>
										<input class="current-page" id="add_order_tax_current_page" type="text" name="paged" value="1" size="1" aria-describedby="add-order-tax-table-paging" />
										<span class="tablenav-paging-text" id="add-order-tax-table-paging">
											of <span class="total-pages">1</span>										</span>
									</span>
									<button type="button" class="next-page button" disabled>
										<span class="screen-reader-text">Next page</span>
										<span aria-hidden="true">&rsaquo;</span>
									</button>
									<button type="button" class="last-page button" disabled>
										<span class="screen-reader-text">Last page</span>
										<span aria-hidden="true">&raquo;</span>
									</button>
								</span>
							</div>
							<br class="clear" />
						</div>
					</form>
				</article>
				<footer>
					<div class="wc-backbone-modal-buttons">
						<button id="btn-ok" class="button button-primary button-large" disabled>Add</button>
					</div>
				</footer>
			</section>
		</div>
	</div>
	<div class="wc-backbone-modal-backdrop modal-close"></div>
</script>
