; Pytest configuration for the WooPayments harness self-tests under tools/.
;
; The harness test files are dash-named (test-*.py), which pytest's default
; test_*.py glob silently skips — a bare `pytest tools/woopayments-merge/`
; used to collect ZERO tests and exit green. python_files fixes collection;
; pythonpath puts the repo root on sys.path so `from tools.woopayments_test_runner
; import ...` resolves without requiring `python3 -m pytest` from the repo root.
[pytest]
python_files = test-*.py test_*.py
pythonpath = ..
